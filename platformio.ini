; Default: classic Nano new bootloader, 12x32, mux channels 4..15 (unverified wiring).
; Select nano12_new for new bootloader. nano16_* scans all 16 channels.
[platformio]
default_envs = nano12_new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 2000000

[env:nano12_old]
board = nanoatmega328
build_flags = -DROW_COUNT=12 -DMUX_CHANNEL_OFFSET=4

[env:nano12_new]
board = nanoatmega328new
build_flags = -DROW_COUNT=12 -DMUX_CHANNEL_OFFSET=4

[env:nano16_old]
board = nanoatmega328
build_flags = -DROW_COUNT=16 -DMUX_CHANNEL_OFFSET=0

[env:nano16_new]
board = nanoatmega328new
build_flags = -DROW_COUNT=16 -DMUX_CHANNEL_OFFSET=0

; Binary diagnostics: AA 55 + 512 bytes. Host MUST use --rows 16.
[env:nano_diag16_fast]
board = nanoatmega328new
build_flags = -DROW_COUNT=16 -DMUX_CHANNEL_OFFSET=0 -DADC_PRESCALER=16

[env:nano_diag16_slow]
board = nanoatmega328new
build_flags = -DROW_COUNT=16 -DMUX_CHANNEL_OFFSET=0 -DADC_PRESCALER=128 -DSAMPLE_SETTLE_US=100 -DADC_DISCARD_FIRST=1

; ASCII only; read with serial.tools.miniterm at 115200 (README.md).
[env:nano_diag_fixed]
board = nanoatmega328new
monitor_speed = 115200
build_flags = -DDIAGNOSTIC_TEXT=1 -DADC_PRESCALER=128 -DSAMPLE_SETTLE_US=100 -DADC_DISCARD_FIRST=1 -DFIXED_MUX_CHANNEL=4 -DFIXED_COLUMN=0
